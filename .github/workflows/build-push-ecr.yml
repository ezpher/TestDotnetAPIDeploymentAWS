name: "2. Build & Push to ECR"

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Optional custom image tag (defaults to commit SHA)'
        required: false
        default: ''

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: my-dotnet-api

jobs:
  build-and-push:
    name: Build & Push ECR Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
      image_uri: ${{ steps.build-image.outputs.image_uri }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: set-tag
        run: |
          CUSTOM_TAG="${{ github.event.inputs.custom_tag }}"
          PR_SHA="${{ github.event.pull_request.head.sha }}"
          COMMIT_SHA="${{ github.sha }}"

          if [ -n "$CUSTOM_TAG" ]; then
            TAG="$CUSTOM_TAG"
          elif [ -n "$PR_SHA" ]; then
            TAG="${PR_SHA:0:7}"
          else
            TAG="${COMMIT_SHA:0:7}"
          fi

          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.image_tag }}
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          
          docker build -t $FULL_IMAGE .
          docker push $FULL_IMAGE
          
          echo "image_uri=$FULL_IMAGE" >> $GITHUB_OUTPUT
