name: "2. Build & Push to ECR"

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Optional custom image tag (defaults to commit SHA)'
        required: false
        default: ''

permissions:
  contents: read
  
# Set mock credentials & emulator endpoint globally
env:
  ECR_REPOSITORY: my-dotnet-api
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT_URL: ${{ vars.LOCAL_EMULATOR_URL }}

jobs:
  build-and-push:
    name: Build & Push ECR Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: set-tag
        run: |
          CUSTOM_TAG="${{ github.event.inputs.custom_tag }}"
          PR_SHA="${{ github.event.pull_request.head.sha }}"
          COMMIT_SHA="${{ github.sha }}"

          if [ -n "$CUSTOM_TAG" ]; then
            TAG="$CUSTOM_TAG"
          elif [ -n "$PR_SHA" ]; then
            TAG="${PR_SHA:0:7}"
          else
            TAG="${COMMIT_SHA:0:7}"
          fi

          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.image_tag }}
        run: |
          TUNNEL_HOST=$(echo $AWS_ENDPOINT_URL | sed -e 's|^[^/]*//||')
          docker build -f src/MyBasicWebApiDemo/Dockerfile -t $TUNNEL_HOST/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Push Image to Emulator via Tunnel
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.image_tag }}
        run: |
          TUNNEL_HOST=$(echo $AWS_ENDPOINT_URL | sed -e 's|^[^/]*//||')
          docker push $TUNNEL_HOST/$ECR_REPOSITORY:$IMAGE_TAG
